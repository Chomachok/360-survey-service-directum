
name: directum360

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: directum-backend
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/directum360.db"
      BaseUrl: "${BASE_URL:-http://localhost:8080}"
      JwtSettings__Secret: "${JWT_SECRET:-development-only-secret-change-this-123456}"
      SmtpSettings__Host: "mailpit"
      SmtpSettings__Port: "1025"
      SmtpSettings__EnableSsl: "false"
      SmtpSettings__Username: ""
      SmtpSettings__Password: ""
      SmtpSettings__FromEmail: "noreply@directum360.ru"
      SmtpSettings__FromName: "Directum360 Feedback"
    ports:
      - "${BIND_IP:-0.0.0.0}:5223:8080"
    volumes:
      - backend-data:/app/data
    depends_on:
      - mailpit
    restart: unless-stopped
    networks:
      - directum-network
    mem_limit: 768m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: directum-frontend
    ports:
      - "${BIND_IP:-0.0.0.0}:8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - directum-network
    mem_limit: 256m

  mailpit:
    image: axllent/mailpit:latest
    container_name: directum-mailpit
    ports:
      - "${BIND_IP:-0.0.0.0}:1025:1025"
      - "${BIND_IP:-0.0.0.0}:8025:8025"
    volumes:
      - mailpit-data:/data
    restart: unless-stopped
    networks:
      - directum-network
    mem_limit: 128m

volumes:
  backend-data:
  mailpit-data:

networks:
  directum-network:
    driver: bridge
