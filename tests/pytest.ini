[pytest]
minversion = 7.0
addopts = -ra --strict-markers --strict-config --html=report.html --self-contained-html
testpaths = api e2e
pythonpath = .
norecursedirs = _draft_backup node_modules .git
markers =
    smoke: критический минимум (главный путь пользователя)
    regression: полный регрессионный набор
    api: тесты REST API
    e2e: браузерные тесты Playwright
    auth: вход и выдача JWT
    surveys: жизненный цикл опроса
    questions: вопросы и шаблоны вопросов
    matrix: матрица оценок
    responses: прохождение опроса и коллекции ответов
    results: результаты и экспорт
    templates: шаблоны опросов и респондентов
    employees: сотрудники и админ-панель
    rbac: права доступа
    contract: проверка контрактов (JSON Schema)
